<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: yuexin-asset:; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月薪喵</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="stage" class="stage">
    <div id="bubble" class="bubble" role="status"></div>
    <button id="mood-button" class="mood-button" aria-label="查看心情和亲密度" aria-expanded="false" aria-controls="companion-menu" title="查看心情和亲密度"><span id="mood-emoji">😊</span><small id="mood-number">75</small></button>
    <div id="companion-menu" class="companion-menu" role="group" aria-label="陪伴月薪喵" hidden>
      <div class="companion-heading"><strong id="mood-label">😊 开心 · 75</strong><button id="companion-close" aria-label="收起陪伴选项">×</button></div>
      <div id="mood-meter" class="companion-meter" role="progressbar" aria-label="心情" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75"><span id="mood-fill"></span></div>
      <div class="bond-heading"><span id="bond-label">初见 · 亲密 0</span><small id="daily-together">今日 0/3</small></div>
      <div id="bond-meter" class="companion-meter bond-meter" role="progressbar" aria-label="亲密等级进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bond-fill"></span></div>
      <div class="companion-buttons"><button id="petting-button">🤲 摸摸</button><button id="play-button">🧶 逗猫</button><button id="sleep-button">💤 睡觉</button></div>
      <p id="companion-status" role="status" aria-live="polite">头顶来回移动鼠标，也能摸摸～</p>
    </div>
    <button id="feeding" class="satiety-button" title="饱腹度 70/100 · 点击喂食" aria-label="饱腹度 70/100，点击展开喂食" aria-expanded="false" aria-controls="quick-feed-menu"><span id="satiety-number" class="satiety-number">70</span></button>
    <div id="quick-feed-menu" class="quick-feed-menu" role="group" aria-label="喂食选项" hidden>
      <div class="quick-feed-heading"><strong>喂一点好吃的</strong><button id="quick-feed-close" aria-label="收起喂食选项" title="收起">×</button></div>
      <button id="quick-feed-fish" class="quick-food"><span>🐟 小鱼干</span><small>+20</small></button>
      <button id="quick-feed-snack" class="quick-food"><span>🍪 小零食</span><small>+10</small></button>
      <button id="quick-feed-can" class="quick-food"><span>🥫 猫罐头</span><small>+35</small></button>
      <p id="quick-feed-status" role="status" aria-live="polite">选一点喜欢的食物。</p>
    </div>
    <button id="focus-button" class="focus-button" aria-label="一起专注" aria-expanded="false" aria-controls="focus-menu" title="一起专注"><span>⏱</span><small id="focus-number">专注</small></button>
    <div id="focus-menu" class="focus-menu" role="group" aria-label="一起专注" hidden>
      <div class="companion-heading"><strong id="focus-heading">一起专注</strong><button id="focus-close" aria-label="收起专注选项">×</button></div>
      <div id="focus-countdown" class="focus-countdown" role="timer" aria-live="off">25:00</div>
      <select id="quick-focus-minutes" aria-label="专注时长"><option value="25">专注 25 分钟</option><option value="45">专注 45 分钟</option><option value="60">专注 60 分钟</option></select>
      <div class="focus-controls"><button id="quick-focus-main">开始专注</button><button id="quick-focus-end" hidden>结束</button></div>
      <p id="quick-focus-status" role="status">安静陪你，结束后提醒休息。</p>
      <div class="focus-links"><button id="focus-settings">调整时长</button><button id="open-journal">陪伴日记</button></div>
    </div>
    <div id="pet" class="pet" aria-label="月薪喵，拖动或点击随机播放动作">
      <img id="idle-image" class="cat idle" src="../assets/yuexin-idle.png" alt="月薪喵">
      <img id="phone-image" class="cat phone" src="../assets/yuexin-phone.png" alt="月薪喵摸鱼">
      <img id="custom-animation" class="cat custom-animation" crossorigin="anonymous" alt="我的图片动作" hidden>
      <span id="effect" class="effect"></span>
      <span id="sleep-effect" class="sleep-effect" aria-hidden="true">Z z z</span>
    </div>
    <div id="affection-effect" class="affection-effect" aria-hidden="true"><span>♥</span><span>♥</span><span>♥</span></div>
    <button id="toy" class="toy" aria-label="点击逗猫球" title="点击小球陪月薪喵玩" hidden>🧶</button>
    <div id="play-hud" class="play-hud" hidden><span id="play-progress">点小球 · 0/3</span><button id="play-cancel" aria-label="结束逗猫">×</button></div>
    <div id="dock" class="dock">
      <button id="reminder" title="提醒事项" aria-label="提醒事项">⏰</button>
      <button id="chat" title="和月薪喵聊天" aria-label="聊天">💬</button>
      <button id="actions" title="我的图片动作" aria-label="动作">🐾</button>
      <button id="settings" title="调整大小" aria-label="设置">⚙</button>
      <button id="usage" class="usage" title="查看剩余额度" aria-label="查看额度">--%</button>
    </div>
  </div>
  <script src="actions.js"></script>
  <script src="action-library.js"></script>
  <script src="action-context.js"></script>
  <script src="petting-gesture.js"></script>
  <script src="pet.js"></script>
</body>
</html>
